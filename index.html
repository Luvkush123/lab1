<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LitShelf — Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --border-hover: #c7d2fe;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --accent-subtle: #eef2ff;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
            --shadow-md: 0 12px 24px -6px rgba(15, 23, 42, 0.08), 0 4px 8px -4px rgba(15, 23, 42, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(at 50% 0%, #ffffff 0%, var(--bg-color) 75%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 60px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 48px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.035em;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 340px));
            justify-content: center;
            gap: 24px;
        }

        .book-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 28px 24px 22px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            translate: 0 0;
            transition: 
                translate 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                box-shadow 0.25s ease, 
                border-color 0.25s ease;
            position: relative;
        }

        .book-card:hover {
            translate: 0 -5px;
            box-shadow: var(--shadow-md);
            border-color: var(--border-hover);
        }

        .book-card:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .badge-wrapper {
            margin-bottom: 14px;
        }

        .book-genre {
            display: inline-flex;
            align-items: center;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--accent);
            background-color: var(--accent-subtle);
            font-weight: 700;
            padding: 5px 11px;
            border-radius: 9999px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .book-card:hover .book-genre {
            background-color: #e0e7ff;
            color: var(--accent-hover);
        }

        .book-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.35;
            letter-spacing: -0.015em;
        }

        .book-author {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .book-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 18px;
            margin-top: auto;
        }

        .book-price {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .details-link {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease;
        }

        .details-link .arrow {
            display: inline-block;
            translate: 0 0;
            transition: translate 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .book-card:hover .details-link {
            color: var(--accent-hover);
        }

        .book-card:hover .details-link .arrow {
            translate: 4px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>LitShelf Catalog</h1>
            <p>Explore hand-picked modern literature and design concepts.</p>
        </header>

        <main class="book-grid">
            <a href="#" class="book-card">
                <div>
                    <div class="badge-wrapper">
                        <span class="book-genre">Design & UX</span>
                    </div>
                    <h2 class="book-title">The Design of Everyday Things</h2>
                    <p class="book-author">by Sahan Veeresh Angadi</p>
                </div>
                <div class="book-footer">
                    <span class="book-price">Rs 5,000</span>
                    <span class="details-link">View Details <span class="arrow">&rarr;</span></span>
                </div>
            </a>

            <a href="#" class="book-card">
                <div>
                    <div class="badge-wrapper">
                        <span class="book-genre">Self Development</span>
                    </div>
                    <h2 class="book-title">Atomic Habits</h2>
                    <p class="book-author">by Jotham paul</p>
                </div>
                <div class="book-footer">
                    <span class="book-price">Rs 10,000</span>
                    <span class="details-link">View Details <span class="arrow">&rarr;</span></span>
                </div>
            </a>
        </main>
    </div>

</body>
</html>
