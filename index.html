<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LitShelf — Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #faf9f6;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            text-align: center;
        }

        header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .book-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
        }

        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.08);
            border-color: var(--accent);
        }

        .book-genre {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 12px;
        }

        .book-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .book-author {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .book-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            margin-top: auto;
        }

        .book-price {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .details-link {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>LitShelf Catalog</h1>
            <p>Explore hand-picked modern literature and design concepts.</p>
        </header>

        <div class="book-grid">
            <a href="" class="book-card">
                <div>
                    <div class="book-genre">Design & UX</div>
                    <h2 class="book-title">The Design of Everyday Things</h2>
                    <p class="book-author">by Luvkush Sharma (24BTRSN022)</p>
                </div>
                <div class="book-footer">
                    <span class="book-price">Rs 5,000</span>
                    <span class="details-link">View Details &rarr;</span>
                </div>
            </a>

            <a href="" class="book-card">
                <div>
                    <div class="book-genre">Self Development</div>
                    <h2 class="book-title">Atomic Habits</h2>
                    <p class="book-author">by Jotham paul</p>
                </div>
                <div class="book-footer">
                    <span class="book-price">Rs 10,000</span>
                    <span class="details-link">View Details &rarr;</span>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
